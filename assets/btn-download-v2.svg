<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 264 74" width="264" height="74">
  <defs>
    <linearGradient id="v2-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5C0" />
      <stop offset="50%" stop-color="#00D2B4" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
    <linearGradient id="v2-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111A2E" />
      <stop offset="100%" stop-color="#0A0E18" />
    </linearGradient>
    <linearGradient id="v2-tag-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5C0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="v2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00E5C0" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Button Background Card -->
  <rect x="2" y="2" width="260" height="70" rx="14" fill="url(#v2-bg)" stroke="url(#v2-border)" stroke-width="2"/>

  <!-- Windows 11 Modern Logo -->
  <g transform="translate(18, 22)">
    <rect x="0" y="0" width="13" height="13" rx="1.5" fill="#00E5C0" />
    <rect x="15" y="0" width="13" height="13" rx="1.5" fill="#00D2B4" />
    <rect x="0" y="15" width="13" height="13" rx="1.5" fill="#00B4D8" />
    <rect x="15" y="15" width="13" height="13" rx="1.5" fill="#38BDF8" />
  </g>

  <!-- Tag Chip -->
  <rect x="60" y="12" width="90" height="16" rx="8" fill="url(#v2-tag-bg)" stroke="#00E5C0" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="105" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.8" fill="#00E5C0" text-anchor="middle">LATEST STABLE</text>

  <!-- Main Version Text -->
  <text x="60" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="0.3">ToolCEO v2.0.0</text>

  <!-- Subtitle Meta -->
  <text x="60" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">Windows x64 • 206 MB</text>

  <!-- Download Arrow Action Pill -->
  <g transform="translate(220, 23)">
    <circle cx="14" cy="14" r="14" fill="#00E5C0" fill-opacity="0.15" stroke="#00E5C0" stroke-width="1.2"/>
    <path d="M14 7v10M9.5 12.5L14 17l4.5-4.5M8 20h12" fill="none" stroke="#00E5C0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
